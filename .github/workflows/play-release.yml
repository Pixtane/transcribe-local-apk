name: Google Play bundle

# Builds the signed Android App Bundle (.aab) for Google Play.
# Signed with the same private release key as the GitHub APK (secrets HOLOS_RELEASE_KEYSTORE_B64
# and HOLOS_RELEASE_STORE_PASSWORD). In Play Console choose "Use existing app signing key", so
# both versions share one signature and users can move between them without reinstalling.
# Optional, to upload automatically after the first manual upload:
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play Developer API service account key (JSON)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to (when upload is enabled)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      upload:
        description: "Upload to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx Android library
        run: ./scripts/fetch-sherpa.sh

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.HOLOS_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret HOLOS_RELEASE_KEYSTORE_B64 is missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HOLOS_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Play bundle
        env:
          HOLOS_RELEASE_STORE_PASSWORD: ${{ secrets.HOLOS_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon bundlePlayRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: holos-play-bundle-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/mapping/playRelease/mapping.txt

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pixtane.holos
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
          track: ${{ inputs.track }}
          status: draft
