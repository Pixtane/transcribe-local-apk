name: Probe TTS models (manual)

# Diagnostics only: inspects candidate Hugging Face models and renders listening samples.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q onnx onnxruntime numpy soundfile "git+https://github.com/patriotyk/ipa-uk" "sherpa-onnx==2.0.1"
      - name: Download Supertonic 3 for comparison
        run: |
          curl -sSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2 | tar xj
          mv sherpa-onnx-supertonic-3-tts-int8-2026-05-11 supertonic
      - name: Download Ukrainian StyleTTS2 pack
        run: |
          mkdir -p uk && cd uk
          for f in manifest.json vocab.txt style.bin model.onnx model.onnx.data stress.sqlite.gz LICENSE-styletts2-ukrainian.txt; do
            curl -sSL -o "$f" "https://huggingface.co/news-production-app/news-voice-packs/resolve/main/uk/$f"
          done
          ls -la
      - name: Download Piper Serhiy and Coqui uk-mai
        run: |
          mkdir -p serhiy && for f in serhiy.onnx serhiy.onnx.json; do curl -sSL -o serhiy/$f https://huggingface.co/dmytro-m/uk_UA-serhiy-high/resolve/main/$f; done
          curl -sSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-coqui-uk-mai.tar.bz2 | tar xj
          mv vits-coqui-uk-mai coqui
      - name: Inspect
        run: python3 scripts/probe_styletts2.py inspect uk
      - name: Render samples
        run: python3 scripts/probe_styletts2.py render uk out
      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
