name: Probe TTS models (manual)

# Diagnostics only: inspects candidate Hugging Face models and renders listening samples.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q onnx onnxruntime numpy soundfile
      - name: Download Ukrainian StyleTTS2 pack
        run: |
          mkdir -p uk && cd uk
          for f in manifest.json vocab.txt style.bin model.onnx model.onnx.data stress.sqlite.gz LICENSE-styletts2-ukrainian.txt; do
            curl -sSL -o "$f" "https://huggingface.co/news-production-app/news-voice-packs/resolve/main/uk/$f"
          done
          ls -la
      - name: Inspect
        run: python3 scripts/probe_styletts2.py inspect uk
      - name: Render samples
        run: python3 scripts/probe_styletts2.py render uk out
      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
