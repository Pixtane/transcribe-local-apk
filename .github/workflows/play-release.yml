name: Google Play bundle

# Builds the signed Android App Bundle (.aab) for Google Play.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HOLOS_UPLOAD_KEYSTORE_B64   base64 of your upload keystore (scripts/create-upload-key.sh)
#   HOLOS_UPLOAD_STORE_PASSWORD keystore password
#   HOLOS_UPLOAD_KEY_ALIAS      key alias (default: upload)
#   HOLOS_UPLOAD_KEY_PASSWORD   key password
# Optional, to upload automatically after the first manual upload:
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play Developer API service account key (JSON)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to (when upload is enabled)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      upload:
        description: "Upload to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx Android library
        run: ./scripts/fetch-sherpa.sh

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.HOLOS_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret HOLOS_UPLOAD_KEYSTORE_B64 is missing (see PLAY_STORE.md)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "HOLOS_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          HOLOS_UPLOAD_STORE_PASSWORD: ${{ secrets.HOLOS_UPLOAD_STORE_PASSWORD }}
          HOLOS_UPLOAD_KEY_ALIAS: ${{ secrets.HOLOS_UPLOAD_KEY_ALIAS }}
          HOLOS_UPLOAD_KEY_PASSWORD: ${{ secrets.HOLOS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: holos-play-bundle-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pixtane.holos
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: draft
