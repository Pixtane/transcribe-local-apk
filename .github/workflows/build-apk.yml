name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as the latest release (phones auto-update to it)"
        type: boolean
        default: true
      notes:
        description: "What's new (shown to users in the update banner). Empty = last commit message."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx Android library
        run: ./scripts/fetch-sherpa.sh

      - name: Probe Hugging Face model mirrors
        continue-on-error: true
        run: |
          M=sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          for repo in csukuangfj/$M csukuangfj2/$M k2-fsa/$M; do
            code=$(curl -s -o /dev/null -L -r 0-0 -w '%{http_code}' "https://huggingface.co/$repo/resolve/main/tts.json")
            echo "HF_PROBE $repo -> $code"
          done

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.HOLOS_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret HOLOS_RELEASE_KEYSTORE_B64 is missing. Add the release key secrets (see README), otherwise the APK could not update installed apps."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HOLOS_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          HOLOS_RELEASE_STORE_PASSWORD: ${{ secrets.HOLOS_RELEASE_STORE_PASSWORD }}
          HOLOS_RELEASE_KEY_PASSWORD: ${{ secrets.HOLOS_RELEASE_KEY_PASSWORD }}
          HOLOS_RELEASE_KEY_ALIAS: ${{ secrets.HOLOS_RELEASE_KEY_ALIAS }}
        run: |
          # Optional secrets left empty must not override the defaults.
          [ -z "$HOLOS_RELEASE_KEY_PASSWORD" ] && unset HOLOS_RELEASE_KEY_PASSWORD
          [ -z "$HOLOS_RELEASE_KEY_ALIAS" ] && unset HOLOS_RELEASE_KEY_ALIAS
          ./gradlew --no-daemon assembleRelease --stacktrace
          # Refuse to publish an APK that is not signed with the release key.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=Holos, O=Pixtane" \
            || { echo "::error::APK is not signed with the Holos release key"; exit 1; }

      - name: Collect APK
        id: apk
        run: |
          VERSION="1.1.${{ github.run_number }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Holos-$VERSION.apk"
          ls -lh out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Holos-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Publish GitHub release
        # Installed apps update themselves to the latest release, so only builds from main (or a
        # manual run with "publish") are released. Other branches only keep the APK as an artifact.
        # The repository variable PUBLISH_APK_RELEASES=false turns publishing off completely.
        if: ${{ vars.PUBLISH_APK_RELEASES != 'false' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          NOTES="$NOTES_INPUT"
          [ -z "$NOTES" ] && NOTES="$(git log -1 --pretty=%B | grep -v -E "^(Co-Authored-By|Claude-Session):" | head -n 12)"
          TAG="v${{ steps.apk.outputs.version }}"
          gh release create "$TAG" out/*.apk \
            --target "${{ github.sha }}" \
            --title "Holos ${{ steps.apk.outputs.version }}" \
            --notes "$NOTES" \
            --latest
